[build-system]
requires = ["uv_build >= 0.9.17 , < 0.10.0"]
build-backend = "uv_build"

[project]
name = "respymethods"
version = "0.9.0"
description = "Robust pipeline for respiration phase-locked analyses of neural or behavioral data including a cluster permutation test for circular data. "
requires-python = ">= 3.13"
dependencies = [
	"numpy",
	"scipy",
	"pyfftw",
	"matplotlib",
	"numba",
	"pandas",
	"pytest>=9.1.0",
	"jupyterlab",
	"seaborn",
	"cmcrameri",
	"setuptools",
#	"hyperqueue", # needed for running simulations on the cluster 
]
authors = [
	{name = "Elio Balestrieri", email = "ebalestr@uni-muenster.de"},
	{name = "Teresa Berther", email = "teresa.berther@uni-muenster.de"},
]
